name: ci

on:
  push:
  pull_request:

jobs:
  host-unit-tests:
    name: host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler, GoogleTest, OpenSSL, pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libssl-dev libgtest-dev python3 python3-pytest python3-cryptography
      - name: Build and run C++ and Python tests
        run: ./scripts/run_host_tests.sh

  colcon:
    name: colcon build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for ROS 2
        id: ros
        run: |
          if [[ -f /opt/ros/jazzy/setup.bash ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ROS 2 Jazzy is installed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: ROS 2 Jazzy is not installed on this runner (/opt/ros/jazzy/setup.bash missing). colcon build and colcon test were not run. This is not a simulated pass."
          fi
      - name: colcon build and test
        if: steps.ros.outputs.available == 'true'
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  px4-sitl:
    name: PX4 SITL failsafe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check for PX4 SITL
        id: px4
        run: |
          if command -v px4 >/dev/null 2>&1 || [[ -n "${PX4_ROOT:-}" && -x "${PX4_ROOT}/build/px4_sitl_default/bin/px4" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "PX4 SITL binary is present; the suite must run for real."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIP: PX4 SITL is not installed on this runner (no px4 binary and PX4_ROOT is unset). The failsafe suite did not run. This is not a green SITL result."
          fi
      - name: Run PX4 SITL failsafe suite
        if: steps.px4.outputs.available == 'true'
        run: ./scripts/px4_sitl_failsafe.sh
