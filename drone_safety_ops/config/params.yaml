# Simulation parameters for drone_safety_ops.
# PX4 on the Pixhawk owns the final failsafes. These values only feed
# supervisor requests (hold, RTL, land, no-arm).
# Every number is an example until it is replaced with a measured value.
# battery endurance 14 min and leg 44.5 km are relayed.
# cruise 40 km/h is assumed. Do not treat them as flight data.

supervisor:
  batt_no_takeoff_pct: 30.0
  cell_temp_limit_c: 60.0
  batt_rtl_pct: 25.0
  batt_land_pct: 10.0
  gear_down_alt_m: 5.0
  deploy_wind_max_ms: 10.0
  detector_timeout_s: 2.0

mission_gate:
  reserve_fraction: 0.20
  energy_margin: 1.3
  link_rtl_s: 30.0
  link_abort_s: 600.0
  max_days: 5
  overnight_wind_hold_ms: 10.0
  flight_wind_rtl_ms: 12.0
  cell_overtemp_c: 60.0
  wh_per_km: 25.0
  default_pack_wh: 400.0

guard:
  human_lockout_m: 5.0
  watch_beyond_m: 15.0
  animal_escape_within_m: 8.0
  animal_closing_mps: 0.3
  escape_min_soc_pct: 30.0

landing:
  leg_km:
    value: 44.5
    origin: relayed
  batt_endurance_min:
    value: 14.0
    origin: relayed
  cruise_kmh:
    value: 40.0
    origin: assumed
  reserve_fraction: 0.20
  energy_margin: 1.3
  cell_hold_c: 45.0
  soc_hold_fraction: 0.95

route:
  straight_line_mi: 68.0
  mi_to_km: 1.609344
  leg_km:
    value: 44.5
    origin: relayed
  batt_endurance_min:
    value: 14.0
    origin: relayed
  cruise_kmh:
    value: 40.0
    origin: assumed
  reserve_fraction: 0.20
  energy_margin: 1.3
  real_flight: false
  tribal_permission: false
  faa_waiver: false

alert:
  duplicate_holdback_s: 60.0
  ntfy_host: ntfy.sh
  default_topic: isaac-drone-CHANGE-ME

watchdog:
  period_s: 1.0
  systemd_watchdog_sec: 5

logging:
  nvme_dir: /mnt/nvme/drone_safety_ops
  fallback_dir: /tmp/drone_safety_ops_logs

px4:
  transport: uxrce_dds
  uxrce_command_topic: /fmu/in/vehicle_command
  request_topic: /drone_safety_ops/px4_vehicle_command
  no_arm_latch_topic: /drone_safety_ops/no_arm_latch
